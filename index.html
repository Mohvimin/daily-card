:root{--g:#0E3B26;--bg:#F4F1E8;--mut:#4A5A52;--line:#E2DDD0;--ar:.8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--g);font-family:Cairo,-apple-system,"Geeza Pro",Tahoma,sans-serif;font-weight:700;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;font-weight:900;margin:4px 0 0}
#cv{width:min(100%,calc(78vh * var(--ar)));height:auto;margin:0 auto;border-radius:14px;box-shadow:0 2px 14px #0002;background:#fff;display:block}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input:not([type=checkbox]):not([type=range]):not([type=color]):not([type=file]){width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px 12px;font:inherit;font-size:18px;color:var(--g)}
input:focus{outline:none;border-color:var(--g)}
.row{display:flex;gap:12px}.row>div{flex:1}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:none;font:inherit;font-size:16px;color:var(--g);padding:0 4px}
.seg button.on{background:var(--g);color:#fff}
.tm{display:flex;gap:8px}.tm input{flex:1}
.ic{min-width:48px;min-height:48px;border:2px solid var(--g);background:#fff;color:var(--g);border-radius:12px;font:inherit;font-size:15px;padding:0 12px}
#share{min-height:60px;border:0;border-radius:16px;background:var(--g);color:#fff;font:inherit;font-weight:900;font-size:22px}
#share:disabled{opacity:.6}
details{background:#fff;border:2px solid var(--line);border-radius:14px}
summary{min-height:52px;display:flex;align-items:center;padding:0 14px;font-size:18px;font-weight:900;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-inline-start:auto;font-size:24px}
details[open]>summary::after{content:"\2212"}
.in{padding:4px 14px 16px;display:flex;flex-direction:column;gap:12px}
.pr{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pr .row{align-items:flex-end}.pr .row>div{min-width:0}
.pr .del{color:#B3122E;border-color:#B3122E;flex:none}
.pr .del:disabled{opacity:.35}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;font-size:17px;color:var(--g);margin:0}
.chk input{width:26px;height:26px;margin:0;accent-color:#0E3B26;flex:none}
.rg{display:flex;align-items:center;gap:10px;min-height:48px}.rg span{min-width:3.2em;text-align:center;color:var(--mut);font-size:15px}
input[type=range]{flex:1;min-height:44px;accent-color:#0E3B26}
.cp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cp label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;min-height:48px}
input[type=color]{width:56px;height:44px;padding:2px;border:2px solid var(--line);border-radius:10px;background:#fff;flex:none}
input[type=file]{font:inherit;font-size:15px;min-height:48px;max-width:100%}
.msg{color:#B3122E;font-size:15px;background:#fff;border:2px solid #B3122E;border-radius:12px;padding:8px 12px}

<main>
<h1>الأسعار</h1>
<div><label for="brand">اسم المجموعة (يُحفظ على هاتفك فقط)</label><input id="brand" type="text" placeholder="اسم المجموعة"></div>

<div id="msg" class="msg" role="status" hidden></div>
<button id="share" type="button">مشاركة</button>
<details open><summary>الأسعار</summary><div class="in">
<div class="seg" id="mode"><button type="button" data-m="both">الكل</button><button type="button" data-m="buy">شراء</button><button type="button" data-m="sell">بيع</button><button type="button" data-m="one">سعر واحد</button></div>
<div id="pairs" style="display:flex;flex-direction:column;gap:10px"></div>
<button class="ic" id="addp" type="button">إضافة زوج</button>
<div><label for="unit">السطر التوضيحي</label><input id="unit" type="text"></div>
<div><label for="time">آخر تحديث</label><div class="tm"><input id="time" type="text"><button class="ic" id="now" type="button">تحديث الوقت</button></div></div>
</div></details>
<details><summary>الشكل والألوان</summary><div class="in">
<div><label>تصميم البطاقة</label><div class="seg" id="style"><button type="button" data-y="classic">كلاسيكي</button><button type="button" data-y="flags">علمين</button><button type="button" data-y="receipt">إيصال</button><button type="button" data-y="split">مقسوم</button><button type="button" data-y="minimal">بسيط</button></div></div>
<div><label>حجم البطاقة</label><div class="seg" id="size"><button type="button" data-s="916">9:16 حالة</button><button type="button" data-s="45">4:5 منشور</button><button type="button" data-s="11">1:1</button></div></div>
<div><label>الألوان</label><div class="seg" id="theme"><button type="button" data-t="light">فاتح</button><button type="button" data-t="gold">أخضر وذهبي</button><button type="button" data-t="red">أبيض وأحمر</button><button type="button" data-t="custom">مخصص</button></div></div>
<div class="cp" id="custom">
<label>الخلفية<input type="color" data-cc="bg"></label>
<label>اللوحة<input type="color" data-cc="panel"></label>
<label>الأساسي<input type="color" data-cc="pri"></label>
<label>النص<input type="color" data-cc="txt"></label>
<label>الثانوي<input type="color" data-cc="mut"></label>
</div>
<div><label for="logoFile">الشعار</label><input id="logoFile" type="file" accept="image/*"></div>
<div><label>موضع الشعار</label><div class="seg" id="lpos"><button type="button" data-p="top">فوق الاسم</button><button type="button" data-p="side">بجانب الاسم</button></div></div>
<div><label>حجم الشعار</label><div class="rg"><input type="range" id="lsize" min="60" max="360" step="10"><span id="v_ls"></span></div></div>
<button class="ic" id="lrm" type="button">إزالة الشعار</button>
</div></details>
<details><summary>معلومات إضافية</summary><div class="in">
<div><label for="tag">العبارة السفلية</label><input id="tag" type="text"></div>
<div><label for="i_wa">رقم واتساب</label><input id="i_wa" type="text" inputmode="tel" dir="ltr" data-info="wa"></div>
<div><label for="i_hours">ساعات العمل</label><input id="i_hours" type="text" data-info="hours"></div>
<div class="row"><div><label for="i_min">الحد الأدنى</label><input id="i_min" type="text" inputmode="decimal" data-info="min"></div><div><label for="i_max">الحد الأعلى</label><input id="i_max" type="text" inputmode="decimal" data-info="max"></div></div>
<div><label for="i_note">ملاحظة</label><input id="i_note" type="text" data-info="note"></div>
</div></details>
<details><summary>إظهار/إخفاء</summary><div class="in">
<label class="chk"><input type="checkbox" data-show="flag">شريط الألوان</label><label class="chk"><input type="checkbox" data-show="sub">عنوان «أسعار اليوم»</label><label class="chk"><input type="checkbox" data-show="pair">سطر اسم الزوج</label><label class="chk"><input type="checkbox" data-show="unit">السطر التوضيحي</label><label class="chk"><input type="checkbox" data-show="time">وقت آخر تحديث</label><label class="chk"><input type="checkbox" data-show="tag">العبارة السفلية</label><label class="chk"><input type="checkbox" data-show="logo">الشعار</label>
</div></details>
<details><summary>أحجام النص</summary><div class="in">
<div><label>اسم المجموعة</label><div class="rg"><input type="range" min="70" max="130" step="5" data-sc="brand"><span id="v_brand"></span></div></div><div><label>أرقام الأسعار</label><div class="rg"><input type="range" min="70" max="130" step="5" data-sc="num"><span id="v_num"></span></div></div><div><label>نص المعلومات</label><div class="rg"><input type="range" min="70" max="130" step="5" data-sc="info"><span id="v_info"></span></div></div>
</div></details>
</main>
<script>
(function(){
var SIZES={'916':[1080,1920],'45':[1080,1350],'11':[1080,1080]};
var PRESETS={

red:{bg:'#FFFFFF',panel:'#FFFFFF',pri:'#B3122E',txt:'#222222',mut:'#555555'}};
function defaults(){return{brand:'',pairs:[{l:'SDG / EGP',buy:'',sell:'',one:''}],mode:'both',style:'classic',unit:'جنيه سوداني مقابل 1 جنيه مصري',time:'',tag:'سريع .. آمن .. بكل ثقة',
size:'45',theme:'light',custom:Object.assign({},PRESETS.light),logoPos:'top',logoSize:160,
info:{wa:'',hours:'',min:'',max:'',note:''},
show:{flag:true,sub:true,pair:true,unit:true,time:true,tag:true,logo:true},

var S=defaults();
try{var r=localStorage.getItem('rt1');if(r){var o=JSON.parse(r);
if(o&&typeof o==='object'){
if(!Array.isArray(o.pairs)||!o.pairs.length){o.pairs=[{l:'SDG / EGP',buy:o.buy==null?'':o.buy,sell:o.sell==null?'':o.sell,one:''}]}
o.pairs=o.pairs.filter(function(p){return p&&typeof p==='object'}).map(function(p){return Object.assign({l:'',buy:'',sell:'',one:''},p)});if(!o.pairs.length)o.pairs=[{l:'SDG / EGP',buy:'',sell:'',one:''}]
delete o.buy;delete o.sell;
['custom','info','show','scale'].forEach(function(k){o[k]=Object.assign({},S[k],o[k]||{})});
Object.assign(S,o)}}}catch(e){}
if(!SIZES[S.size])S.size='45';
if(['both','buy','sell','one'].indexOf(S.mode)<0)S.mode='both';
if(['classic','flags','receipt','split','minimal'].indexOf(S.style)<0)S.style='classic';
if(S.theme!=='custom'&&!PRESETS[S.theme])S.theme='light';
var LOGO='';try{LOGO=localStorage.getItem('rt1logo')||''}catch(e){}
var $=function(i){return document.getElementById(i)};
function nowStr(){try{return new Intl.DateTimeFormat('ar-EG',{timeZone:'Africa/Cairo',year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date())}catch(e){return new Date().toLocaleString()}}
if(!S.time)S.time=nowStr();
function save(){try{localStorage.setItem('rt1',JSON.stringify(S))}catch(e){}}
function msg(t){var m=$('msg');m.textContent=t||'';m.hidden=!t}
/* colours */
function hx(h){h=String(h||'#000').replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');var n=parseInt(h,16);if(isNaN(n))n=0;return[n>>16&255,n>>8&255,n&255]}
function lum(h){var a=hx(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]}
function cr(a,b){var x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function mix(a,b,t){var p=hx(a),q=hx(b);return'#'+[0,1,2].map(function(i){return('0'+Math.round(p[i]*(1-t)+q[i]*t).toString(16)).slice(-2)}).join('')}
function pick(list,bg){var b=list[0];list.forEach(function(c){if(cr(c,bg)>cr(b,bg))b=c});return b}
function TH(){
var p=S.theme==='custom'?S.custom:PRESETS[S.theme]||PRESETS.light;
var t={bg:p.bg,panel:p.panel,pri:p.pri,txt:p.txt,mut:p.mut};
t.box=lum(t.panel)<.3?mix(t.panel,'#000000',.25):t.panel;

/* drawing helpers */
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
var FF='Cairo,-apple-system,"Geeza Pro",Tahoma,sans-serif';
var AR=/[؀-ۿ]/;
function dirOf(s){return AR.test(s)?'rtl':'ltr'}
function T(c,s,x,y,size,w,col,dir,al){c.font=w+' '+size+'px '+FF;c.fillStyle=col;c.direction=dir||'rtl';c.textAlign=al||'center';c.textBaseline='alphabetic';c.fillText(s,x,y)}
function mw(c,s,size,w){c.font=w+' '+size+'px '+FF;return c.measureText(s).width}
function fit(c,s,size,w,max){var m=mw(c,s,size,w);return m>max?Math.max(6,Math.floor(size*max/m)):size}
function icon(c,type,x,y,s,col){
c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=Math.max(2,s*.09);c.lineCap='round';c.lineJoin='round';c.beginPath();

else{c.moveTo(x-s*.42,y-s*.25);c.lineTo(x+s*.42,y-s*.25);c.moveTo(x-s*.42,y);c.lineTo(x+s*.42,y);c.moveTo(x-s*.42,y+s*.25);c.lineTo(x+s*.1,y+s*.25)}
c.stroke();c.restore()}
/* logo */
var LI=null,LOGOP=Promise.resolve();
function setLogo(url){
if(!url){LI=null;LOGOP=Promise.resolve();return}
var im=new Image();
LOGOP=new Promise(function(res){im.onload=function(){LI=im;res();render()};im.onerror=function(){LI=null;res()}});
im.src=url}
function infoList(){
var i=S.info,L=[];
if(i.wa.trim())L.push({ic:'wa',lb:'واتساب',v:i.wa.trim(),d:'ltr'});

else if(mn)L.push({ic:'range',lb:'الحد الأدنى',v:mn,d:'ltr'});
else if(mx)L.push({ic:'range',lb:'الحد الأعلى',v:mx,d:'ltr'});

/* ---- drawing context (set per draw call) ---- */
var c,t,W,H,sb,sn,si,hasLogo,side,IL,P,n,single,m;
var LBL={buy:'شراء',sell:'بيع',one:'السعر'};
var STYLES=['classic','flags','receipt','split','minimal'];
function kc(k){return k==='buy'?t.buy:k==='sell'?t.sell:t.pri}
function modeKeys(){return m==='both'?['buy','sell']:[m]}
function val(v){return v===''||v==null?'—':String(v)}
function add(a,x){if(x)a.push(x)}
function dash(a){if(c.setLineDash)c.setLineDash(a||[])}
function ax_(al,x0,x1){return al==='right'?x1:al==='left'?x0:(x0+x1)/2}
/* flow layout: items {h,d(y,h)} or {flex:true,d(y,h)}; shrinks k until the flexible part has `need` */
function flow(x,y,h,mk,need){
var k=1,it,fx,fn,body;
for(;;){it=mk(k);fx=0;fn=0;it.forEach(function(q){if(q.flex)fn++;else fx+=q.h});body=h-fx;if(body>=need||k<=.5)break;k-=.04}

it.forEach(function(q){var hh=q.flex?bh:q.h;if(q.d)q.d(yy,hh);yy+=hh})}
/* flags + icons */
function flagFill(kind,w,h){
var x=-w/2,y=-h/2,s=h/3;
c.fillStyle=kind==='sd'?'#D21034':'#CE1126';c.fillRect(x,y,w,s+1);

else{
var e=h*.13;c.fillStyle='#C09300';
c.beginPath();c.arc(0,-e*.95,e*.5,0,Math.PI*2);c.fill();

function tilt(cx,cy,w,h,deg,kind,outline,rad){
c.save();c.translate(cx,cy);c.rotate(deg*Math.PI/180);
c.save();rr(c,-w/2,-h/2,w,h,rad);c.clip();flagFill(kind,w,h);c.restore();

function swapIcon(x,y,s,col,vert){
function q(dx,dy){return vert?[x+dy,y+dx]:[x+dx,y+dy]}
function mv(dx,dy){var p=q(dx,dy);c.moveTo(p[0],p[1])}

var a=s*.5,g=s*.17,hd=s*.19;
c.save();c.strokeStyle=col;c.lineWidth=Math.max(3,s*.09);c.lineCap='round';c.lineJoin='round';c.beginPath();

/* item builders */
