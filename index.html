<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rate Card</title>
<meta name="theme-color" content="#0E3B26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rates">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:Cairo;font-weight:700;src:url(cairo-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Cairo;font-weight:900;src:url(cairo-arabic-900-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Cairo;font-weight:700;src:url(cairo-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Cairo;font-weight:900;src:url(cairo-latin-900-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{--g:#0E3B26;--bg:#F4F1E8;--card:#FFFFFF;--mut:#4A5A52;--line:#E2DDD0;--ok:#1E7A46;--bad:#B3122E;--warn-bg:#FFF6DB;--warn:#7A4B00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--g);font-family:Cairo,-apple-system,"Geeza Pro",Tahoma,sans-serif;font-weight:700;font-size:16px}
.app{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(190px + env(safe-area-inset-bottom));min-height:100vh}
.view{display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
h1{font-size:20px;font-weight:900;margin:0}
.pill{font-size:14px;background:var(--g);color:#fff;border-radius:999px;padding:5px 10px;min-height:28px;display:inline-flex;align-items:center;direction:ltr;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill:empty{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.gh{font-size:14px;color:var(--mut);margin:6px 6px 0;font-weight:700}
.grp{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column}
.ri{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.ri:last-child{border-bottom:0}
.hint{font-size:14px;color:var(--mut);font-weight:700}
label,.lbl{display:block;font-size:14px;color:var(--mut);margin:0}
label.row,label.sw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;font-size:15px;color:var(--g)}
.sw-row{padding:10px 12px;border-bottom:1px solid var(--line)}
.sw-row:last-child{border-bottom:0}
input:where(:not([type=checkbox]):not([type=range]):not([type=color]):not([type=file])){width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:5px 10px;font:inherit;font-size:15px;color:var(--g)}
input:focus{outline:none;border-color:var(--g)}
input.big{min-height:64px;border:2px solid var(--line);border-radius:15px;font-size:clamp(30px,10.5vw,40px);font-weight:900;text-align:center;direction:ltr;padding:0 10px;line-height:1.1}
input.big:focus{border-color:var(--g)}
.prices{display:flex;flex-direction:column;gap:6px}
.prices>div>label{margin-bottom:6px}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bs.single{grid-template-columns:1fr}
.delta{font-size:14px;min-height:20px;text-align:center;margin-top:4px}
.delta.up{color:var(--ok)}
.delta.down{color:var(--bad)}
.segd{display:flex;background:#ECE8DC;border-radius:12px;padding:3px;gap:3px}
.segd button{flex:1;min-height:44px;border:0;background:none;border-radius:9px;font:inherit;font-size:15px;color:var(--mut);padding:0 6px}
.segd button.on{background:var(--card);color:var(--g);box-shadow:0 1px 3px #0002}
.chips{display:flex;gap:6px;background:none;padding:0;justify-content:center}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;min-height:44px;padding:0 12px;color:var(--g);font:inherit;font-size:14px}
.chips button.on{background:var(--g);border-color:var(--g);color:#fff}
.meta{font-size:14px;color:var(--mut);text-align:center}
.txtbtn{border:0;background:none;color:var(--g);font:inherit;font-size:14px;min-height:44px;padding:0 12px;text-decoration:underline;text-underline-offset:3px}
.tm{display:flex;gap:8px}.tm input{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--g);background:var(--g);color:#fff;font:inherit;font-size:15px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--g)}
.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.pv{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;background:none;border:0;padding:0;font:inherit;color:var(--g);cursor:pointer}
.pv canvas{display:block;border-radius:14px;box-shadow:0 3px 12px #0003;background:#fff}
.pvs{font-size:14px;color:var(--mut)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 4px 8px;scroll-snap-type:x proximity}
.th{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font:inherit;font-size:14px;color:var(--g);padding:0;scroll-snap-align:start;min-width:120px}
.th canvas{width:120px;height:auto;display:block;border-radius:9px;background:#fff;box-shadow:0 1px 4px #0002;outline:2px solid transparent;outline-offset:3px}
.th.on canvas{outline-color:var(--g)}
.swrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sw{width:42px;height:42px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer;flex:none;font:inherit;color:var(--mut);font-size:20px;display:flex;align-items:center;justify-content:center;background:#fff}
.sw.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--g)}
.sw.add{border:2px dashed var(--mut);background:none;box-shadow:none}
.sw.add.on{border-color:var(--g);color:var(--g)}
.cp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.cp label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;min-height:44px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 10px}
input[type=color]{width:46px;height:36px;padding:2px;border:1px solid var(--line);border-radius:9px;background:#fff;flex:none}
.szrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sz{min-height:90px;background:#fff;border:1px solid var(--line);border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:inherit;font-size:15px;color:var(--g);padding:8px}
.sz.on{border:2px solid var(--g)}
.sz small{font-size:14px;color:var(--mut)}
.shape{display:block;border:2px solid var(--mut);border-radius:5px;margin-bottom:4px}
.sz.on .shape{border-color:var(--g)}
.sh916{width:19px;height:34px}.sh45{width:27px;height:34px}.sh11{width:31px;height:31px}
.rg{display:flex;align-items:center;gap:8px;min-height:44px}
.rg span{min-width:3.4em;text-align:center;color:var(--mut);font-size:14px}
input[type=range]{flex:1;min-height:44px;accent-color:#0E3B26}
input.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:999px;background:#D6D1C4;position:relative;flex:none;margin:0;transition:background .2s;cursor:pointer}
input.switch::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .2s}
input.switch:checked{background:var(--g)}
input.switch:checked::after{transform:translateX(-20px)}
.adv{border-radius:15px}
.adv summary{min-height:46px;display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:900;cursor:pointer;list-style:none}
.adv summary::-webkit-details-marker{display:none}
.adv summary::after{content:"+";margin-inline-start:auto;font-size:24px;color:var(--mut)}
.adv[open] summary::after{content:"\2212"}
.adv .in{padding:4px 12px 14px;display:flex;flex-direction:column;gap:10px}
.pr{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.prow{display:flex;gap:6px;align-items:flex-end}.prow>div{flex:1;min-width:0}
.prow .del{flex:none;color:var(--bad);border-color:var(--bad);background:#fff}
.prow .del:disabled{opacity:.35}
.warnline{color:var(--warn);font-size:14px;line-height:1.4;background:var(--warn-bg);border:1px solid #E0B040;border-radius:12px;padding:6px 10px}
.msg{color:var(--bad);font-size:14px;background:#fff;border:1px solid var(--bad);border-radius:12px;padding:7px 10px;margin:0 12px 10px}
.actbar{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;background:linear-gradient(rgba(244,241,232,0),var(--bg) 40%);padding-top:18px}
.actbar .bar{width:min(100%,480px);padding:0 16px 10px;display:flex;gap:10px;pointer-events:auto}
#share{flex:1;min-height:52px;border:0;border-radius:15px;background:var(--g);color:#fff;font:inherit;font-weight:900;font-size:18px;cursor:pointer}
#share:disabled{opacity:.6}
.sq{width:52px;min-height:52px;flex:none;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--g);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.sq svg{width:21px;height:21px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.navin{display:flex;width:min(100%,480px)}
.nav button{flex:1;min-height:54px;background:none;border:0;color:var(--mut);font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:6px 0}
.nav button.on{color:var(--g)}
.nav svg,.sq svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav svg{width:21px;height:21px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:var(--g);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;z-index:9;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(14,59,38,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:10}
#ovCv{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 120px);border-radius:14px;background:#fff;box-shadow:0 4px 24px #0006}
.ovx{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--g);font:inherit;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tlrow{display:flex;align-items:center;gap:6px}
.tlrow .meta{flex:1;min-width:0;line-height:1.35}
.tlrow .txtbtn,.tlrow .chipbtn{flex:none}
.tlrow .meta.warn{color:var(--warn);font-weight:900}
.chipbtn{min-height:44px;border:1px solid #E0B040;background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:0 14px;font:inherit;font-size:14px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1350" hidden></canvas>
<div class="app">

<section class="view" id="v-today" aria-label="اليوم">
  <div class="head"><h1>أسعار اليوم</h1><span class="pill" id="pill"></span></div>
  <button class="pv" id="pvBtn" type="button" aria-label="معاينة البطاقة، فتح ملء الشاشة">
    <canvas id="pvCv" width="240" height="427"></canvas>
    <span class="pvs" id="pvSub"></span>
  </button>
  <div class="segd" id="modeSeg" role="group" aria-label="نوع السعر">
    <button type="button" data-m="one">سعر واحد</button>
    <button type="button" data-m="both">شراء وبيع</button>
  </div>
  <div class="card prices">
    <div id="wOne"><label for="inOne">السعر</label><input class="big" id="inOne" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><div class="delta" id="dOne" hidden></div></div>
    <div class="bs" id="wBs">
      <div id="wBuy"><label for="inBuy">شراء</label><input class="big" id="inBuy" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><div class="delta" id="dBuy" hidden></div></div>
      <div id="wSell"><label for="inSell">بيع</label><input class="big" id="inSell" type="text" inputmode="decimal" autocomplete="off" placeholder="0"><div class="delta" id="dSell" hidden></div></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="عرض">
      <button type="button" data-m="both">الكل</button>
      <button type="button" data-m="buy">شراء فقط</button>
      <button type="button" data-m="sell">بيع فقط</button>
    </div>
    <div class="warnline" id="warn" role="status" hidden></div>
    <div class="tlrow"><div class="meta" id="tLine"></div><button class="chipbtn" id="staleNow" type="button" hidden>الآن</button><button class="txtbtn" id="editT" type="button" aria-expanded="false" aria-controls="tEdit">تعديل</button></div>
    <div id="tEdit" class="tedit" hidden>
      <div class="tm"><input id="time" type="text" aria-label="آخر تحديث"><button class="btn ghost" id="now" type="button">الآن</button></div>
      <label class="sw-row"><span>تحديث الوقت تلقائياً عند تغيير السعر</span><input class="switch" id="autoT" type="checkbox"></label>
    </div>
  </div>
</section>

<section class="view" id="v-design" aria-label="التصميم" hidden>
  <h1>التصميم</h1>
  <div class="gh">شكل البطاقة</div>
  <div class="card" style="padding:6px 8px">
    <div class="strip" id="styleRow" role="group" aria-label="شكل البطاقة">
      <button class="th" type="button" data-y="classic"><canvas id="th-classic" width="96" height="171"></canvas><span>كلاسيكي</span></button>
      <button class="th" type="button" data-y="flags"><canvas id="th-flags" width="96" height="171"></canvas><span>علمين</span></button>
      <button class="th" type="button" data-y="receipt"><canvas id="th-receipt" width="96" height="171"></canvas><span>إيصال</span></button>
      <button class="th" type="button" data-y="split"><canvas id="th-split" width="96" height="171"></canvas><span>مقسوم</span></button>
      <button class="th" type="button" data-y="minimal"><canvas id="th-minimal" width="96" height="171"></canvas><span>بسيط</span></button>
    </div>
  </div>
  <div class="gh">الألوان</div>
  <div class="card">
    <div class="swrow" id="swRow" role="group" aria-label="الألوان">
      <button class="sw" id="sw-light" type="button" data-t="light" aria-label="فاتح"></button>
      <button class="sw" id="sw-gold" type="button" data-t="gold" aria-label="أخضر وذهبي"></button>
      <button class="sw" id="sw-red" type="button" data-t="red" aria-label="أبيض وأحمر"></button>
      <button class="sw add" id="sw-custom" type="button" data-t="custom" aria-label="ألوان مخصصة">+</button>
    </div>
    <div class="cp" id="custom" hidden>
      <label>الخلفية<input type="color" data-cc="bg"></label>
      <label>اللوحة<input type="color" data-cc="panel"></label>
      <label>الأساسي<input type="color" data-cc="pri"></label>
      <label>النص<input type="color" data-cc="txt"></label>
      <label>الثانوي<input type="color" data-cc="mut"></label>
    </div>
  </div>
  <div class="gh">الحجم</div>
  <div class="szrow" id="sizeRow" role="group" aria-label="الحجم">
    <button class="sz" type="button" data-s="916"><span class="shape sh916"></span>حالة<small>9:16</small></button>
    <button class="sz" type="button" data-s="45"><span class="shape sh45"></span>منشور<small>4:5</small></button>
    <button class="sz" type="button" data-s="11"><span class="shape sh11"></span>مربع<small>1:1</small></button>
  </div>
</section>

<section class="view" id="v-settings" aria-label="الإعدادات" hidden>
  <h1>الإعدادات</h1>
  <div class="gh">البطاقة</div>
  <div class="grp">
    <div class="ri"><label for="brand">اسم المجموعة</label><input id="brand" type="text" maxlength="40" placeholder="اسم المجموعة"><div class="hint">يُحفظ على هاتفك فقط</div></div>
    <div class="ri"><label for="pairLbl">اسم الزوج</label><input id="pairLbl" type="text" dir="ltr" placeholder="SDG / EGP"></div>
    <div class="ri"><span class="lbl">الشعار</span><div class="btnrow"><label class="btn" id="logoAdd" for="logoFile">إضافة شعار</label><input class="vh" id="logoFile" type="file" accept="image/*"><button class="btn danger" id="lrm" type="button">إزالة</button></div></div>
    <div class="ri"><span class="lbl">موضع الشعار</span><div class="segd" id="lposSeg" role="group" aria-label="موضع الشعار"><button type="button" data-p="top">فوق الاسم</button><button type="button" data-p="side">بجانب الاسم</button></div></div>
    <div class="ri"><span class="lbl">حجم الشعار</span><div class="rg"><input type="range" id="lsize" aria-label="حجم الشعار" min="60" max="360" step="10"><span id="v_ls"></span></div></div>
    <div id="msg" class="msg" role="status" hidden></div>
  </div>

  <div class="gh">معلومات إضافية</div>
  <div class="grp">
    <div class="ri"><label for="unit">السطر التوضيحي</label><input id="unit" type="text" maxlength="50"></div>
    <div class="ri"><label for="tag">العبارة السفلية</label><input id="tag" type="text" maxlength="50"></div>
    <div class="ri"><label for="i_wa">رقم واتساب</label><input id="i_wa" type="text" inputmode="tel" dir="ltr" maxlength="20" data-info="wa"></div>
    <div class="ri"><label for="i_hours">ساعات العمل</label><input id="i_hours" type="text" maxlength="60" data-info="hours"></div>
    <div class="ri" style="flex-direction:row;gap:10px"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><label for="i_min">الحد الأدنى</label><input id="i_min" type="text" inputmode="decimal" maxlength="40" data-info="min"></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><label for="i_max">الحد الأعلى</label><input id="i_max" type="text" inputmode="decimal" maxlength="40" data-info="max"></div></div>
    <div class="ri"><label for="i_note">ملاحظة</label><input id="i_note" type="text" maxlength="120" data-info="note"></div>
  </div>

  <div class="gh">إظهار على البطاقة</div>
  <div class="grp">
    <label class="sw-row"><span>شريط الألوان</span><input class="switch" type="checkbox" data-show="flag"></label>
    <label class="sw-row"><span>عنوان «أسعار اليوم»</span><input class="switch" type="checkbox" data-show="sub"></label>
    <label class="sw-row"><span>سطر اسم الزوج</span><input class="switch" type="checkbox" data-show="pair"></label>
    <label class="sw-row"><span>السطر التوضيحي</span><input class="switch" type="checkbox" data-show="unit"></label>
    <label class="sw-row"><span>وقت آخر تحديث</span><input class="switch" type="checkbox" data-show="time"></label>
    <label class="sw-row"><span>العبارة السفلية</span><input class="switch" type="checkbox" data-show="tag"></label>
    <label class="sw-row"><span>الشعار</span><input class="switch" type="checkbox" data-show="logo"></label>
  </div>

  <div class="gh">أحجام النص</div>
  <div class="grp">
