<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rate Card</title>
<meta name="theme-color" content="#0E3B26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rates">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:Cairo;font-weight:700;src:url(cairo-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Cairo;font-weight:900;src:url(cairo-arabic-900-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Cairo;font-weight:700;src:url(cairo-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Cairo;font-weight:900;src:url(cairo-latin-900-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--g:#0E3B26;--bg:#F4F1E8;--mut:#4A5A52;--line:#E2DDD0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--g);font-family:Cairo,-apple-system,"Geeza Pro",Tahoma,sans-serif;font-weight:700;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;font-weight:900;margin:4px 0 0}
#cv{width:100%;height:auto;aspect-ratio:1080/1350;border-radius:14px;box-shadow:0 2px 14px #0002;background:#fff;display:block}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=number]{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px 12px;font:inherit;font-size:18px;color:var(--g)}
input:focus{outline:none;border-color:var(--g)}
.row{display:flex;gap:12px}.row>div{flex:1}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:none;font:inherit;font-size:17px;color:var(--g)}
.seg button.on{background:var(--g);color:#fff}
.tm{display:flex;gap:8px}.tm input{flex:1}
.ic{min-width:48px;min-height:48px;border:2px solid var(--g);background:#fff;color:var(--g);border-radius:12px;font:inherit;font-size:15px;padding:0 12px}
#share{min-height:60px;border:0;border-radius:16px;background:var(--g);color:#fff;font:inherit;font-weight:900;font-size:22px}
#share:disabled{opacity:.6}
</style>
</head>
<body>
<main>
<h1>الأسعار</h1>
<div><label for="brand">اسم المجموعة (يُحفظ على هاتفك فقط)</label><input id="brand" type="text"></div>
<canvas id="cv" width="1080" height="1350"></canvas>
<div class="row">
<div><label for="buy">شراء</label><input id="buy" type="number" inputmode="decimal" step="any" placeholder="0"></div>
<div><label for="sell">بيع</label><input id="sell" type="number" inputmode="decimal" step="any" placeholder="0"></div>
</div>
<div class="seg" id="mode"><button data-m="both">الكل</button><button data-m="buy">شراء</button><button data-m="sell">بيع</button></div>
<div><label for="unit">السطر التوضيحي</label><input id="unit" type="text"></div>
<div><label for="time">آخر تحديث</label><div class="tm"><input id="time" type="text"><button class="ic" id="now" type="button">تحديث الوقت</button></div></div>
<div><label for="tag">العبارة السفلية</label><input id="tag" type="text"></div>
<button id="share" type="button">مشاركة</button>
</main>
<script>
(function(){
var D={brand:'',buy:'',sell:'',mode:'both',unit:'جنيه سوداني مقابل 1 جنيه مصري',time:'',tag:'سريع .. آمن .. بكل ثقة'};
var S=Object.assign({},D);
try{var r=localStorage.getItem('rt1');if(r)Object.assign(S,JSON.parse(r))}catch(e){}
var $=function(i){return document.getElementById(i)};
function nowStr(){try{return new Intl.DateTimeFormat('ar-EG',{timeZone:'Africa/Cairo',year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date())}catch(e){return new Date().toLocaleString()}}
if(!S.time)S.time=nowStr();
function save(){try{localStorage.setItem('rt1',JSON.stringify(S))}catch(e){}}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
var FF='Cairo,-apple-system,"Geeza Pro",Tahoma,sans-serif';
function T(c,s,x,y,size,w,col,dir,al){c.font=w+' '+size+'px '+FF;c.fillStyle=col;c.direction=dir||'rtl';c.textAlign=al||'center';c.textBaseline='alphabetic';c.fillText(s,x,y)}
function fit(c,s,size,w,max){c.font=w+' '+size+'px '+FF;var m=c.measureText(s).width;return m>max?Math.floor(size*max/m):size}
function draw(cv){
var c=cv.getContext('2d'),W=1080,H=1350,G='#0E3B26',M='#4A5A52';
c.clearRect(0,0,W,H);
c.fillStyle='#F4F1E8';c.fillRect(0,0,W,H);
rr(c,40,40,W-80,H-80,64);c.fillStyle='#fff';c.fill();c.lineWidth=4;c.strokeStyle=G;c.stroke();
var bn=S.brand||'اسم المجموعة',bs=fit(c,bn,96,900,W-160);T(c,bn,W/2,215,bs,900,G);
T(c,'أسعار اليوم',W/2,285,40,700,M);
T(c,'SDG / EGP',W/2,340,40,700,M,'ltr');
var cols=['#007229','#D21034','#FFFFFF','#000000','#CE1126'],sw=64,sx=(W-sw*5)/2;
cols.forEach(function(k,i){c.fillStyle=k;c.fillRect(sx+i*sw,375,sw,14)});
c.lineWidth=2;c.strokeStyle='#D8D3C4';c.strokeRect(sx,375,sw*5,14);
var m=S.mode,by=450,bh=420;
function box(x,w,label,lc,val,size){
rr(c,x,by,w,bh,36);c.fillStyle='#fff';c.fill();c.lineWidth=3;c.strokeStyle='#E2DDD0';c.stroke();
T(c,label,x+w/2,by+90,56,900,lc);
var v=val===''||val==null?'—':String(val);
var s=fit(c,v,size,900,w-40);
T(c,v,x+w/2,by+bh/2+s*0.45+40,s,900,G,'ltr');
}
if(m==='both'){box(556,444,'شراء','#007229',S.buy,140);box(80,444,'بيع','#CE1126',S.sell,140)}
else if(m==='buy')box(190,700,'شراء','#007229',S.buy,200);
else box(190,700,'بيع','#CE1126',S.sell,200);
var us=fit(c,S.unit,44,700,W-160);T(c,S.unit,W/2,985,us,700,G);
var ts='آخر تحديث: '+S.time,tz=fit(c,ts,38,700,W-160);T(c,ts,W/2,1060,tz,700,M);
var tg=S.tag||' ';c.font='900 52px '+FF;
var tw=Math.min(W-200,Math.max(300,c.measureText(tg).width+120));
var ts2=fit(c,tg,52,900,tw-80);
rr(c,(W-tw)/2,1135,tw,120,60);c.fillStyle=G;c.fill();
T(c,tg,W/2,1135+60+ts2*0.34,ts2,900,'#fff');
}
var cv=$('cv');
function render(){draw(cv)}
function sync(){
$('brand').value=S.brand;$('buy').value=S.buy;$('sell').value=S.sell;$('unit').value=S.unit;$('time').value=S.time;$('tag').value=S.tag;
[].forEach.call(document.querySelectorAll('#mode button'),function(b){b.classList.toggle('on',b.dataset.m===S.mode)});
}
function upd(){save();render()}
[['brand','brand'],['buy','buy'],['sell','sell'],['unit','unit'],['time','time'],['tag','tag']].forEach(function(p){
$(p[0]).addEventListener('input',function(e){S[p[1]]=e.target.value;upd()})});
$('mode').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.mode=b.dataset.m;sync();upd()});
$('now').addEventListener('click',function(){S.time=nowStr();sync();upd()});
$('share').addEventListener('click',function(){
var btn=this;btn.disabled=true;
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
var o=document.createElement('canvas');o.width=1080;o.height=1350;draw(o);
return new Promise(function(res){o.toBlob(res,'image/png')})
}).then(function(blob){
var f=new File([blob],'rates.png',{type:'image/png'});
if(navigator.canShare&&navigator.canShare({files:[f]})){
return navigator.share({files:[f]}).catch(function(e){if(e&&e.name!=='AbortError')throw e})}
var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rates.png';document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
}).catch(function(e){alert('تعذرت المشاركة')}).then(function(){btn.disabled=false});
});
sync();render();
if(document.fonts){
['900 40px Cairo','700 40px Cairo'].forEach(function(f){document.fonts.load(f,'أ0').catch(function(){});document.fonts.load(f,'0').catch(function(){})});
document.fonts.ready.then(render);
}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
</body>
</html>
